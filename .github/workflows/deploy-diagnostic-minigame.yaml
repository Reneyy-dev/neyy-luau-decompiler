name: Deploy diagnostic Minigame hang

on:
  push:
    branches:
      - diagnostic/minigame-hang
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RUSTC_BOOTSTRAP: "1"
      RUSTUP_TOOLCHAIN: "1.98.1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Apply Roblox v12 and diagnostic patches
        run: |
          set -euo pipefail
          git apply --check --recount patches/roblox-bytecode-v12-callfb.patch
          git apply --recount patches/roblox-bytecode-v12-callfb.patch
          git apply --check --recount patches/constant-tag8.patch
          git apply --recount patches/constant-tag8.patch
          git apply --check --recount patches/diagnostic-minigame-hang.patch
          git apply --recount patches/diagnostic-minigame-hang.patch
          git apply --check --recount patches/diagnostic-function-stage.patch
          git apply --recount patches/diagnostic-function-stage.patch
          git apply --check --recount patches/diagnostic-construct-stage.patch
          git apply --recount patches/diagnostic-construct-stage.patch
          git apply --check --recount patches/diagnostic-construct-route.patch
          git apply --recount patches/diagnostic-construct-route.patch
          git apply --check --recount patches/diagnostic-upvalues-stage.patch
          git apply --recount patches/diagnostic-upvalues-stage.patch
          git apply --check --recount patches/diagnostic-upvalues-profile.patch
          git apply --recount patches/diagnostic-upvalues-profile.patch
          git apply --check --recount patches/diagnostic-upvalues-phase.patch
          git apply --recount patches/diagnostic-upvalues-phase.patch

      - name: Verify luau-lifter still compiles and tests
        run: cargo test -p luau-lifter -- --nocapture

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy v18 to fresh isolated diagnostic Worker
        working-directory: luau-worker
        run: npx --yes wrangler@4.134.0 deploy --name neyy-luau-decompiler-upvalues-v18-diag

      - name: Smoke-test upvalue-phase diagnostic bundle
        run: |
          set -euo pipefail
          URL='https://neyy-luau-decompiler-upvalues-v18-diag.apa-kah1337.workers.dev'
          sleep 5

          health="$(curl -sS -H 'Cache-Control: no-cache' "$URL/health?ci=${GITHUB_RUN_ID}")"
          echo "HEALTH=$health"
          if [ "$health" != "neyy-luau-decompiler upvalues-phase-marker-v18" ]; then
            echo 'ERROR: Worker did not return the expected upvalues-phase build marker'
            exit 1
          fi

          status="$(curl -sS -o /tmp/function-stage-body.txt -w '%{http_code}' \
            -X POST "$URL/diag/function-stage?id=173&stage=construct_upvalues_statements&ci=${GITHUB_RUN_ID}" \
            -H 'Content-Type: application/octet-stream' \
            -H 'Cache-Control: no-cache' \
            --data-binary '')"
          body="$(cat /tmp/function-stage-body.txt)"
          echo "UPVALUES_PHASE_HTTP=$status"
          echo "UPVALUES_PHASE_BODY=$body"

          if [ "$status" = "404" ]; then
            echo 'ERROR: Worker returned 404 for upvalue-phase probe route'
            exit 1
          fi
