name: Luau v12 CI

on:
  push:
    branches:
      - feature/roblox-bytecode-v12
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Run luau-lifter tests
        run: cargo test -p luau-lifter -- --nocapture
